# TwinDock development broker.
# Listens on all interfaces so the SiWx917 board on the same Wi-Fi LAN can connect.
# Anonymous access is acceptable only on a private demo network; do not expose this to the internet.
listener 1883 0.0.0.0
allow_anonymous true

# Keep the retained twin/gateway/hello across broker restarts.
persistence true
persistence_location broker/data/

log_type error
log_type warning
log_type notice
log_dest stdout
