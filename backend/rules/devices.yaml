# Site devices. Facts per device: device_id, type, label, status, zone_id, zone_name, source, and one
# fact per reading channel holding its latest value (temperature, open, co2_ppm, ...).
- id: cold_room_door_open
  name: Cold room door left open
  plain: Warn when the cold room door has been open for more than 60 s.
  subject: device
  where:
    - {field: type, op: eq, value: door_sensor}
    - {field: zone_id, op: eq, value: FAC01_COLD}
  when:
    - {field: open, op: eq, value: true}
  for_s: 60
  severity: warning
  message: "Cold room door open for over 60 s ({device_id})"

- id: cold_room_temperature
  name: Cold room temperature out of range
  plain: Warn when a cold room temperature sensor reads outside 0–5 °C for 30 s.
  subject: device
  where:
    - {field: type, op: eq, value: env_sensor}
    - {field: zone_id, op: eq, value: FAC01_COLD}
  when:
    - {field: temperature, op: outside, value: [0, 5]}
  for_s: 30
  severity: warning
  message: "Cold room at {temperature:.1f} °C, outside 0–5 °C ({device_id})"

- id: air_quality_co2
  name: High CO₂
  plain: Warn when an air quality sensor reads more than 1000 ppm CO₂ for 60 s.
  subject: device
  where:
    - {field: type, op: eq, value: air_quality}
  when:
    - {field: co2_ppm, op: gt, value: 1000}
  for_s: 60
  severity: warning
  message: "CO₂ at {co2_ppm:.0f} ppm in {zone_name} ({device_id})"

- id: device_fault
  name: Device fault
  plain: Warn while a simulated device reports a fault in its status.
  subject: device
  where:
    - {field: source, op: eq, value: sim}
  when:
    - {field: status, op: eq, value: fault}
  severity: warning
  message: "{device_id} reports a fault: {fault}"

# K2/K3 kit devices
- id: gas_alarm
  name: Gas alarm
  plain: Raise a critical alert when a gas detector reaches its alarm level. Badges in the zone and next to it are told to evacuate. TwinDock adds to, never replaces, the certified gas system.
  subject: device
  where:
    - {field: type, op: eq, value: gas_detector}
  when:
    - {field: alarm, op: eq, value: true}
  severity: critical
  message: "Gas alarm in {zone_name}: CO {co_ppm:.0f} ppm ({device_id})"

- id: fire_alarm
  name: Fire alarm (from the fire panel)
  plain: Raise a critical alert when the fire panel bridge reads the panel's alarm contact. TwinDock only reads the certified panel; evacuation follows the site's procedure.
  subject: device
  where:
    - {field: type, op: eq, value: fire_panel}
  when:
    - {field: alarm, op: eq, value: true}
  severity: critical
  message: "Fire panel alarm reported by {label} ({device_id})"

- id: heat_stress
  name: Heat stress
  plain: Advise rest breaks when the heat index in a zone reaches 32 °C (from the zone's temperature and humidity). Badges in the zone get a rest reminder; no worker is named.
  subject: device
  when:
    - {field: heat_index, op: gte, value: 32}
  for_s: 60
  severity: info
  message: "Heat index {heat_index:.0f} °C in {zone_name}: rest breaks advised ({device_id})"

- id: water_leak
  name: Water leak
  plain: Warn when a leak probe detects liquid on the floor.
  subject: device
  where:
    - {field: type, op: eq, value: leak_sensor}
  when:
    - {field: wet, op: eq, value: true}
  severity: warning
  message: "Liquid on the floor in {zone_name} ({device_id})"

- id: conveyor_jam
  name: Conveyor jam
  plain: Warn when the conveyor monitor reports a jam for more than 5 s.
  subject: device
  where:
    - {field: type, op: eq, value: conveyor_monitor}
  when:
    - {field: jam, op: eq, value: true}
  for_s: 5
  severity: warning
  message: "Conveyor jam ({device_id})"

- id: low_air_pressure
  name: Low air pressure
  plain: Warn when the compressed-air pressure stays below 6 bar for 10 s.
  subject: device
  where:
    - {field: type, op: eq, value: compressor_monitor}
  when:
    - {field: pressure_bar, op: lt, value: 6.0}
  for_s: 10
  severity: warning
  message: "Air pressure {pressure_bar:.1f} bar, below 6 bar ({device_id})"

# F3
- id: compressor_fault
  name: Compressor fault
  plain: Raise a critical alert when the compressor monitor reports the compressor tripped.
  subject: device
  where:
    - {field: type, op: eq, value: compressor_monitor}
  when:
    - {field: tripped, op: eq, value: true}
  severity: critical
  message: "Compressor tripped: air pressure will fall ({device_id})"

- id: etp_outflow_ph
  name: ETP outflow pH out of band
  plain: Warn when the treated water's pH is outside 6.5 to 8.5 for 30 s (example limits for the demo; a real plant uses its permit).
  subject: device
  where:
    - {field: type, op: eq, value: water_quality}
    - {field: label, op: eq, value: ETP outflow quality}
  when:
    - {field: ph, op: outside, value: [6.5, 8.5]}
  for_s: 30
  severity: warning
  message: "ETP outflow pH {ph:.1f}, outside 6.5-8.5 ({device_id})"

- id: etp_outflow_turbidity
  name: ETP outflow cloudy
  plain: Warn when the treated water's turbidity is above 25 NTU for 30 s (example limit).
  subject: device
  where:
    - {field: type, op: eq, value: water_quality}
    - {field: label, op: eq, value: ETP outflow quality}
  when:
    - {field: turbidity_ntu, op: gt, value: 25}
  for_s: 30
  severity: warning
  message: "ETP outflow turbidity {turbidity_ntu:.0f} NTU, above 25 NTU ({device_id})"
